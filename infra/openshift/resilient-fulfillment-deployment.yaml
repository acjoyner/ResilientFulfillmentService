apiVersion: apps/v1
kind: Deployment
metadata:
  name: resilient-fulfillment-service
  namespace: acjoyner-dev
  labels:
    app: resilient-fulfillment-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resilient-fulfillment-service
  template:
    metadata:
      labels:
        app: resilient-fulfillment-service
    spec:
      containers:
      - name: resilient-fulfillment-service
        image: default-route-openshift-image-registry.apps.rm2.thpm.p1.openshiftapps.com/acjoyner-dev/resilient-fulfillment-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: DB_URL
          value: "jdbc:h2:mem:fulfillmentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
        - name: REDIS_HOST
          value: "localhost"
        resources:
          limits:
            cpu: "500m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /api/v1/orders/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: resilient-fulfillment-service
  namespace: acjoyner-dev
  labels:
    app: resilient-fulfillment-service
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: resilient-fulfillment-service
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: resilient-fulfillment-service
  namespace: acjoyner-dev
  labels:
    app: resilient-fulfillment-service
spec:
  to:
    kind: Service
    name: resilient-fulfillment-service
  port:
    targetPort: 8080
  tls:
    termination: edge
